<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>등록과 목록</title>
</head>
<body>
  <h1>등록 후 목록 갱신</h1>

  <input id="title" placeholder="제목">
  <input id="author" placeholder="저자">
  <input id="year" type="number" placeholder="연도">

  <button id="saveBtn">등록</button>

  <p id="msg"></p>
  <ul id="list"></ul>

  <script>
    // 도서 목록 불러오기
    async function loadList() {
      const response = await fetch("/books");
      const books = await response.json();

      const ul = document.getElementById("list");
      ul.innerHTML = "";

      for (const book of books) {
        const li = document.createElement("li");

        li.textContent =
          book.id + ". " +
          book.title + " - " +
          book.author + " (" +
          book.year + ")";

        ul.appendChild(li);
      }
    }

    // 등록 버튼 클릭
    document.getElementById("saveBtn").addEventListener("click", async () => {
      const payload = {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        year: Number(document.getElementById("year").value)
      };

      const response = await fetch("/books", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      const data = await response.json();
      const msg = document.getElementById("msg");

      if (response.status === 201) {
        msg.textContent = "등록 완료: " + data.title;

        // 입력칸 비우기
        document.getElementById("title").value = "";
        document.getElementById("author").value = "";
        document.getElementById("year").value = "";

        // 목록 다시 불러오기
        loadList();
      } else if (response.status === 422) {
        msg.textContent = "입력값을 확인하세요.";
      } else {
        msg.textContent = "등록 실패: 상태 코드 " + response.status;
      }
    });

    // 페이지가 열릴 때 기존 목록 불러오기
    loadList();
  </script>
</body>
</html>
