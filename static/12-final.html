<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>도서 등록 최종</title>
</head>
<body>
  <h1>도서 등록</h1>

  <input id="title" placeholder="제목">
  <input id="author" placeholder="저자">
  <input id="year" type="number" placeholder="연도">

  <button id="saveBtn">등록</button>

  <p id="msg"></p>
  <ul id="list"></ul>

  <script>
    // 도서 목록을 불러와 화면에 출력
    async function loadList() {
      const response = await fetch("/books");
      const books = await response.json();

      const ul = document.getElementById("list");
      ul.innerHTML = "";

      for (const book of books) {
        const li = document.createElement("li");

        li.textContent =
          book.id + ". " +
          book.title + " - " +
          book.author + " (" +
          book.year + ")";

        ul.appendChild(li);
      }
    }

    // 성공 또는 오류 메시지 출력
    function showMessage(text, isError) {
      const msg = document.getElementById("msg");

      msg.textContent = text;
      msg.style.color = isError ? "red" : "green";
    }

    // 등록 버튼 클릭
    document.getElementById("saveBtn").addEventListener("click", async () => {
      const payload = {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        year: Number(document.getElementById("year").value)
      };

      const response = await fetch("/books", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (response.status === 201) {
        showMessage("등록 완료: " + data.title, false);

        // 등록 성공 후 입력칸 비우기
        document.getElementById("title").value = "";
        document.getElementById("author").value = "";
        document.getElementById("year").value = "";

        // 목록 새로고침
        loadList();
      } else if (response.status === 409) {
        showMessage("중복 제목: " + data.detail, true);
      } else if (response.status === 422) {
        const messages = data.detail.map(error =>
          error.loc.join(".") + " : " + error.msg
        );

        showMessage("입력 오류: " + messages.join(" / "), true);
      } else {
        showMessage(
          "알 수 없는 오류 (상태 코드: " + response.status + ")",
          true
        );
      }
    });

    // 페이지가 열릴 때 목록 표시
    loadList();
  </script>
</body>
</html>
